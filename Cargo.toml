[package]
name = "nixify"
version = "0.1.0"
edition = "2021"
description = "A read-only Linux to NixOS migration assistant"
license = "MIT"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
